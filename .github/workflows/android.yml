name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> $GITHUB_PATH
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "platform-tools" > /dev/null 2>&1 || true
          "$SDKMGR" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Install Gradle 8.13
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> $GITHUB_PATH
          /opt/gradle-8.13/bin/gradle --version

      - name: Build Debug APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --console=plain --stacktrace

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WxDexInspector-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
