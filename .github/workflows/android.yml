name: Android CI

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        run: |
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "$(dirname "$SDKMGR")" >> $GITHUB_PATH
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "platform-tools" > /dev/null 2>&1 || true

      - name: Install Gradle 8.13
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> $GITHUB_PATH
          /opt/gradle-8.13/bin/gradle --version

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/wxdi-release.jks
          echo "WXDI_KEYSTORE_FILE=/tmp/wxdi-release.jks" >> $GITHUB_ENV
          echo "WXDI_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "WXDI_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "WXDI_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Debug APK
        run: gradle assembleDebug --console=plain --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --console=plain --stacktrace

      - name: Build info
        run: |
          echo "===== outputs ====="
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WxDexInspector-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: WxDexInspector-apks
          path: apks

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: WxDexInspector ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: apks/**/*.apk
